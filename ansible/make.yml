---
- name: common setup
  hosts: all
  strategy: free
  vars:
    target_env: "{{ lookup('env', 'target') }}"
  tasks:
  - include_role:
      name: "{{ service_name }}"
    loop:
    - tar
    - nc
    - disable-package-manager-timers
    - disable-motd
    - app-agent
    - appctl
    - arping
    - openjdk
    - caddy
    - kafka
    - unzip
    - kafka-manager
    - zabbix-agent
    - jmx-exporter
    - users_groups
    loop_control:
      loop_var: service_name
