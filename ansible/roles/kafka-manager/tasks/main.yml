- include_role:
    name: downloader
  vars:
    opts:
      pkg_name: cmak
      pkg_version: "{{ kafka_manager_version }}"
      pkg_feature: "linux"
      pkg_fileType: ".zip"
      pkg_url: "https://github.com/yahoo/CMAK/releases/download/{{ kafka_manager_version }}/cmak-{{ kafka_manager_version }}.zip"

- name: decompress file
  unarchive:
    src: "{{ downloaded }}"
    dest: "/tmp"
    creates: "/tmp/cmak-{{ kafka_manager_version }}/bin/cmak"

- name: copy cmak files
  copy:
      src: /tmp/cmak-{{ kafka_manager_version }}/
      dest: "{{ installPath }}/current/"
      remote_src: yes

- name: link kafka-manager to cmak
  file:
    src: "{{ installPath }}/current/bin/cmak"
    dest: "{{ installPath }}/current/bin/kafka-manager"
    state: link

- name: Remove tmp files
  file:
    path: /tmp/cmak-{{ kafka_manager_version }}
    state: absent

- name: update permissions of service directories
  file:
    path: /opt/{{ item }}
    owner: kafka
    group: kafka
    recurse: yes
    state: directory
  with_items:
    - kafka-manager

- name: setup journald.conf
  lineinfile:
    path: /etc/systemd/journald.conf
    line: 'ForwardToSyslog=no'
    state: present