---
- name: setvariables
  set_fact:
    kafka_manager_version: "{{ kafka_manager_version | d('3.0.0.6') }}"
    installPath: "/opt/kafka-manager"

- name: install confd files
  include_role:
    name: confd-files

- name: copy systemd files
  copy: #拷贝service文件
    src: files/{{ item }}
    dest: /{{ item }}
    directory_mode: yes
  with_items:
    - lib/systemd/system/

- name: disable auto start
  systemd:
    name: "{{ svc_name }}"
    state: stopped
    masked: yes
  loop:
  - kafka-manager
  loop_control:
    loop_var: svc_name

- name: copy binaries
  copy: #拷贝service文件
    src: files/opt/
    dest: /opt
    owner: root
    group: kafka
    mode: preserve
    directory_mode: u=rwx,g=rx,o=

- name: prepare dir
  file:
    path: "{{ installPath }}/{{ kafka_manager_version }}"
    state: directory

- name: link for current
  file:
    src: "{{ installPath }}/{{ kafka_manager_version }}"
    dest: "{{ installPath }}/current"
    state: link

