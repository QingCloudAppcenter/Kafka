---
- name: set vars
  set_fact:
    os: "{{ os | d(default_os) }}"

- name: ubuntu
  file:
    path: "{{ remote_usr.home }}/.hushlogin"
    owner: "{{ remote_usr.name }}"
    state: touch
  loop:
  - name: ubuntu
    home: /home/ubuntu
  - name: root
    home: /root
  loop_control:
    loop_var: remote_usr
  when: os == 'ubuntu'

- name: kylin - cockpit
  file:
    src: /dev/null
    dest: /etc/motd.d/cockpit
    state: link
    force: yes
  when: os == 'kylin'

- name: kylin - /etc/motd
  copy:
    content: ""
    dest: /etc/motd
    force: yes
  when: os == 'kylin'

- name: openEuler
  block:
  - name: openEuler - clear motd
    copy:
      content: ""
      dest: /etc/motd
  - name: openEuler - clear system-info.sh
    file:
      path: /etc/profile.d/system-info.sh
      state: absent
  when: os == 'openEuler'